{% for machine in machines %}
<a href="{% url 'registry:machine_detail' machine.slug %}" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 transition-all">
    <div class="text-xs text-primary">{{ machine.vendor }}</div>
    <div class="text-sm font-medium">{{ machine.model_name }}</div>
</a>
{% empty %}
<div class="px-4 py-3 text-sm text-zinc-500">No results.</div>
{% endfor %}
