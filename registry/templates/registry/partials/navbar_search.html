<div class="list-group list-group-flush p-1">
  {% for machine in machines %}
    <a href="{% url 'registry:machine_detail' machine.pk %}" class="list-group-item list-group-item-action border-0 rounded small py-2">
      <span class="fw-bold">{{ machine.vendor }}</span> {{ machine.model_name }}
    </a>
  {% endfor %}
</div>
