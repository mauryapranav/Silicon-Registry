<form method="POST" action="{% url 'registry:flag_report' report.pk %}" class="mt-4 space-y-3">
    {% csrf_token %}
    <select name="reason" required class="input-dark rounded-lg py-2 px-3 text-sm w-full">
        {% for val, label in reasons %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
    </select>
    <textarea name="details" rows="2" placeholder="Additional details (optional)..." class="input-dark rounded-lg py-2 px-3 text-sm w-full"></textarea>
    <button type="submit" class="w-full py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-sm font-medium hover:bg-red-500/20 transition-all">Submit Flag</button>
</form>
