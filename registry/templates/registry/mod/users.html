{% extends 'registry/mod/base_mod.html' %}
{% block mod_content %}
<h1 class="text-2xl font-black tracking-tight mb-8">Manage Users</h1>

<div class="term-window rounded-xl overflow-hidden">
  <table class="w-full text-sm">
    <thead>
      <tr style="border-bottom:1px solid rgba(148,163,184,0.06);">
        <th class="tbl-head text-left px-5 py-4">User</th>
        <th class="tbl-head text-left px-5 py-4">Role</th>
        <th class="tbl-head text-right px-5 py-4">Trust</th>
        <th class="tbl-head text-right px-5 py-4">Update</th>
      </tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr class="tbl-row">
        <td class="px-5 py-3.5">
          <a href="{% url 'registry:user_profile' u.username %}"
             class="font-semibold hover:text-primary transition-colors">{{ u.username }}</a>
          <div class="text-[11px] text-slate-700 mt-0.5">{{ u.email }}</div>
        </td>
        <td class="px-5 py-3.5">
          <span class="badge-primary text-[10px] px-2.5 py-1 rounded-full font-bold">{{ u.role_type }}</span>
        </td>
        <td class="px-5 py-3.5 text-right font-semibold
          {% if u.trust_ratio >= 80 %}text-primary{% elif u.trust_ratio >= 50 %}text-yellow-500{% else %}text-slate-600{% endif %}">
          {{ u.trust_ratio }}%
        </td>
        <td class="px-5 py-3.5 text-right">
          <form method="POST" class="flex gap-2 justify-end">
            {% csrf_token %}
            <input type="hidden" name="user_id" value="{{ u.pk }}">
            <div class="relative">
              <select name="role_type" class="input-dark rounded-xl text-xs py-1.5 px-3 pr-7 appearance-none">
                {% for val, label in roles %}
                  <option value="{{ val }}" {% if val == u.role_type %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
              </select>
              <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-600 pointer-events-none"></i>
            </div>
            <button class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all"
              style="background:rgba(96,165,250,0.08);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);"
              onmouseenter="this.style.background='rgba(96,165,250,0.16)'"
              onmouseleave="this.style.background='rgba(96,165,250,0.08)'">Save</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
