{% extends 'registry/base.html' %}

{% block content %}
<div class="max-w-[1440px] mx-auto px-5 sm:px-8 pt-8 pb-24">
  <div class="flex items-start gap-6">

    <!-- ── Mod Sidebar ───────────────────────── -->
    <aside class="hidden lg:block w-60 shrink-0">
      <div class="term-window sticky top-20">
        <div class="term-titlebar">
          <span class="term-pid text-[9px]">[MOD]</span>
          <span class="term-path text-[9px]">~/admin</span>
        </div>
        <div class="p-3">
          {% with url_name=request.resolver_match.url_name %}
          <a href="{% url 'registry:mod_dashboard' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium mb-0.5 transition-all font-mono
               {% if url_name == 'mod_dashboard' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_dashboard' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
          </a>
          <a href="{% url 'registry:mod_reports' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium mb-0.5 transition-all font-mono
               {% if url_name == 'mod_reports' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_reports' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="file-text" class="w-4 h-4"></i> Reports
          </a>
          <a href="{% url 'registry:mod_specs' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium mb-0.5 transition-all font-mono
               {% if url_name == 'mod_specs' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_specs' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="settings-2" class="w-4 h-4"></i> Specs
          </a>
          <a href="{% url 'registry:mod_fixes' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium mb-0.5 transition-all font-mono
               {% if url_name == 'mod_fixes' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_fixes' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="wrench" class="w-4 h-4"></i> Fixes
          </a>
          <a href="{% url 'registry:mod_trust' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium mb-0.5 transition-all font-mono
               {% if url_name == 'mod_trust' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_trust' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="shield-check" class="w-4 h-4"></i> Trust
          </a>
          <a href="{% url 'registry:mod_users' %}"
             class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-medium transition-all font-mono
               {% if url_name == 'mod_users' %}text-primary{% else %}text-slate-500 hover:text-white hover:bg-slate-800/40{% endif %}"
             {% if url_name == 'mod_users' %}style="background:rgba(96,165,250,0.08);"{% endif %}>
            <i data-lucide="users" class="w-4 h-4"></i> Users
          </a>
          {% endwith %}
        </div>
      </div>
    </aside>

    <!-- ── Mod Content ───────────────────────── -->
    <div class="flex-grow min-w-0 fade-in">
      {% block mod_content %}{% endblock %}
    </div>

  </div>
</div>
{% endblock %}
