{% extends 'registry/base.html' %}
{% block title %}Flag Report | Silicon Registry{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 pt-8 pb-20">
    <h1 class="text-2xl font-bold tracking-tight mb-6 fade-in">Flag Report #{{ report.pk }}</h1>
    <form method="POST" class="card-surface p-8 rounded-2xl space-y-5 fade-in">
        {% csrf_token %}
        <div>
            <label class="text-sm font-medium text-zinc-400 mb-1.5 block">Reason</label>
            <select name="reason" required class="input-dark rounded-lg py-2.5 px-3 text-sm w-full">
                {% for val, label in reasons %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div>
            <label class="text-sm font-medium text-zinc-400 mb-1.5 block">Details (optional)</label>
            <textarea name="details" rows="3" class="input-dark rounded-lg py-2.5 px-3 text-sm w-full"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-sm font-medium hover:bg-red-500/20 transition-all">Submit Flag</button>
    </form>
</div>
{% endblock %}
