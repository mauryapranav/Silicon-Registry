{% extends 'registry/base.html' %}
{% block title %}Flag Report | Silicon Registry{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 pt-8 pb-20">
    <div class="term-window fade-in">
        <div class="term-titlebar">
            <div class="term-dots"><span></span><span></span><span></span></div>
            <span class="term-pid">[!] FLAG</span>
            <span class="term-path">~/flag/report-{{ report.pk }}</span>
        </div>
        <div class="term-body">
            <h1 class="font-mono font-bold text-2xl tracking-tight mb-6"><span class="text-red-400">></span> flag_report #{{ report.pk }}</h1>
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label class="term-label mb-2 block">Reason</label>
                    <div class="relative">
                        <select name="reason" required class="input-dark rounded-lg py-2.5 px-3 text-sm w-full font-mono">
                            {% for val, label in reasons %}<option value="{{ val }}">{{ label }}</option>{% endfor %}
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-600 pointer-events-none"></i>
                    </div>
                </div>
                <div>
                    <label class="term-label mb-2 block">Details (optional)</label>
                    <textarea name="details" rows="3" class="input-dark rounded-lg py-2.5 px-3 text-sm w-full font-mono"></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 bg-red-400/10 text-red-400 border border-red-400/20 rounded-lg text-sm font-medium font-mono hover:bg-red-400/20 transition-all">$ submit flag</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
