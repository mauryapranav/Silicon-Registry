{% extends 'registry/base.html' %}
{% block title %}Suggest Spec | Silicon Registry{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 pt-8 pb-20">
    <h1 class="text-2xl font-bold tracking-tight mb-2 fade-in">Suggest Spec</h1>
    <p class="text-zinc-500 text-sm mb-8 fade-in">Contribute specification data for <span class="text-white font-medium">{{ machine.vendor }} {{ machine.model_name }}</span></p>
    <form method="POST" class="card-surface p-8 rounded-2xl space-y-5 fade-in" style="animation-delay:0.1s">
        {% csrf_token %}
        <div>
            <label class="text-sm font-medium text-zinc-400 mb-1.5 block">Field</label>
            <select name="field_name" required class="input-dark rounded-lg py-2.5 px-3 text-sm w-full">
                <option value="">Select field...</option>
                {% for val, label in spec_fields %}
                <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="text-sm font-medium text-zinc-400 mb-1.5 block">Suggested Value</label>
            <input type="text" name="suggested_value" required class="input-dark rounded-lg py-2.5 px-3 text-sm w-full" placeholder="e.g. Core i7-1365U">
        </div>
        <div>
            <label class="text-sm font-medium text-zinc-400 mb-1.5 block">Source URL (optional)</label>
            <input type="url" name="source_url" class="input-dark rounded-lg py-2.5 px-3 text-sm w-full" placeholder="https://psref.lenovo.com/...">
        </div>
        <button type="submit" class="w-full bg-primary text-black py-3 rounded-xl font-semibold text-sm hover:bg-accent transition-colors">Submit Suggestion</button>
    </form>
</div>
{% endblock %}
