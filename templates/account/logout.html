{% extends "registry/base.html" %}
{% load i18n %}

{% block title %}Sign Out | Silicon Registry{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 pt-16 pb-24">
    <div class="card-surface p-10 rounded-2xl relative overflow-hidden fade-in text-center">
        <div class="absolute top-0 left-0 w-full h-0.5 bg-gradient-to-r from-primary to-accent"></div>
        <div class="w-14 h-14 bg-zinc-800 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-zinc-700">
            <i data-lucide="log-out" class="text-zinc-400 w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-2">Sign out</h1>
        <p class="text-zinc-500 text-sm mb-8">Are you sure you want to sign out?</p>
        <form method="POST" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
            {% endif %}
            <button type="submit" class="w-full bg-red-500 text-white py-3 rounded-xl font-semibold text-sm hover:bg-red-600 transition-colors mb-3">Sign out</button>
        </form>
        <a href="{% url 'registry:homepage' %}" class="w-full inline-block py-3 bg-zinc-800 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-700 transition-all">Cancel</a>
    </div>
</div>
{% endblock %}
